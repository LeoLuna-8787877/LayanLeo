<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171326"><title>ليان | لعبة الغرف</title>
<style>
:root{--bg:#171326;--panel:#241d38;--panel2:#302542;--pink:#f1a9d0;--lav:#c8b5f4;--cream:#fff3e8;--muted:#c4b8cf;--gold:#f4d48c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#483052 0,#211a32 42%,var(--bg) 78%);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:22px 16px 54px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:1px}.hero{text-align:center;padding:34px 18px 26px}.moon{font-size:48px;color:var(--gold)}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(32px,8vw,48px);color:var(--pink);margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.8}.status{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px 0}.pill{border:1px solid #6a5578;background:#2b223c;border-radius:30px;padding:7px 12px;font-size:12px;color:var(--lav)}h2{font:25px Georgia,serif;color:var(--pink);margin:24px 2px 12px}.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.room{background:linear-gradient(145deg,#342743,#251e36);border:1px solid #594664;border-radius:20px;padding:18px 14px;text-align:right;color:var(--cream);min-height:140px;cursor:pointer}.room:disabled{opacity:.42;cursor:not-allowed}.room .ico{font-size:30px;display:block;margin-bottom:10px}.room b{font-size:16px}.room small{display:block;color:var(--muted);margin-top:6px;line-height:1.6}.panel{display:none;background:#241d38;border:1px solid #594664;border-radius:22px;padding:18px;margin-top:16px}.panel.active{display:block}.back,.btn{border:0;border-radius:30px;padding:10px 16px;font:inherit;cursor:pointer}.back{background:#40304e;color:var(--pink);margin-bottom:14px}.btn{background:var(--pink);color:#291b31;font-weight:650;margin:7px 4px 4px 0}.btn.alt{background:#514064;color:var(--cream)}.dialog{background:#302542;border:1px solid #554365;border-radius:17px;padding:14px;line-height:1.8;margin:12px 0}.character{display:flex;gap:12px;align-items:center;background:#302542;border-radius:16px;padding:12px;margin:9px 0}.avatar{width:54px;height:54px;flex:none;border-radius:16px;background:#493550;display:grid;place-items:center;font-size:27px}.character p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.choice{background:#3b2d4c;border:1px solid #695276;color:var(--cream);border-radius:13px;padding:12px;font:inherit;cursor:pointer}.choice:active,.room:active{transform:scale(.985)}input{width:100%;padding:13px;border-radius:13px;border:1px solid #725c80;background:#191426;color:white;font:inherit;margin:8px 0}.feedback{min-height:25px;color:var(--gold);font-size:13px;line-height:1.6}.progress{height:7px;border-radius:8px;background:#45364f;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));width:0;transition:width .25s}.end{text-align:center;padding:20px 8px}.end .big{font-size:55px}.foot{text-align:center;color:#9d8eaa;font-size:11px;margin-top:30px}
@media(max-width:390px){main{padding:16px 12px 40px}.room{padding:14px 11px}}
</style></head>
<body><main>
<div class="top"><span>✦ مغامرة ليان ✦</span><span id="counter">0 / 4 غرف</span></div>
<header class="hero"><div class="moon">☾</div><h1>سرّ الغرف الأربع</h1><div class="sub">كل غرفة تخبّي لغزًا، وكل شخصية تعرف جزءًا من الطريق.<br>اجمعي الرموز وافتحي الباب الأخير.</div><div class="status"><span class="pill" id="keys">المفاتيح: 0</span><span class="pill">نسخة تجريبية قابلة للعب</span></div></header>
<h2>اختاري بابًا</h2><div class="rooms">
<button class="room" id="r0" onclick="openRoom(0)"><span class="ico">🎪</span><b>غرفة السيرك</b><small>Pierrot & Harlequin<br>لغز القناعَين</small></button>
<button class="room" id="r1" onclick="openRoom(1)" disabled><span class="ico">🌱</span><b>الحديقة السرية</b><small>Sprout & Looey<br>لغز البذور</small></button>
<button class="room" id="r2" onclick="openRoom(2)" disabled><span class="ico">🍯</span><b>غرفة الألعاب</b><small>Honey-senpai<br>لغز الحلوى</small></button>
<button class="room" id="r3" onclick="openRoom(3)" disabled><span class="ico">🌙</span><b>البرج الليلي</b><small>Vassago<br>لغز النجوم</small></button>
</div>
<section class="panel" id="game"><button class="back" onclick="closeRoom()">رجوع للأبواب ←</button><div id="roomContent"></div></section>
<section class="panel" id="ending"><div class="end"><div class="big">🔐 ✨</div><h2>انفتح الباب الأخير!</h2><p class="sub">وصلتِ للنهاية وجمعتِ كل الرموز. هذه الغرف صارت عالمك يا ليان ♡</p><button class="btn" onclick="restart()">العب من جديد</button></div></section>
<div class="foot">صُنعت هذه المغامرة بحب ♡</div>
</main>
<script>
const solved=[false,false,false,false];let current=-1;
const rooms=[
{title:"غرفة السيرك",icon:"🎪",who:[["Pierrot","🤡","يترك لك تلميحًا بين الستائر."],["Harlequin","🎭","يخبّئ الرمز خلف القناع الصحيح."]],story:"على الطاولة قناعان: واحد حزين وواحد مبتسم. توجد ملاحظة تقول: «اختر الوجه الذي لا يُظهر شعوره الحقيقي». أي قناع تختارين؟",opts:["القناع الحزين","القناع المبتسم"],answer:0,clue:"Pierrot يهمس: أحيانًا الوجه الهادئ يخفي أكثر مما يقول.",reward:"رمز القمر ☾"},
{title:"الحديقة السرية",icon:"🌱",who:[["Sprout","🌱","يعرف ترتيب نمو البذور."],["Looey","🎈","يذكّرك أن تبدأي من البداية."]],story:"أمامك ثلاث مراحل لنمو النبتة، لكن ترتيبها اختلط: زهرة، بذرة، نبتة صغيرة. رتّبيها من البداية إلى النهاية.",opts:["بذرة ← نبتة ← زهرة","زهرة ← بذرة ← نبتة","نبتة ← زهرة ← بذرة"],answer:0,clue:"Sprout يقول: كل شيء يبدأ صغيرًا جدًا.",reward:"رمز الوردة ✿"},
{title:"غرفة الألعاب",icon:"🍯",who:[["Honey-senpai","🐰","يحب الأشياء اللطيفة ويلاحظ التفاصيل." ]],story:"Honey وجد ثلاث علب حلوى. العلبة الوردية ليست الأولى، والعلبة الصفراء تأتي قبل البنفسجية. ما ترتيب العلب الصحيح؟",opts:["وردي، أصفر، بنفسجي","أصفر، بنفسجي، وردي","أصفر، وردي، بنفسجي"],answer:1,clue:"تذكّري: الوردي ليس الأول، والأصفر قبل البنفسجي.",reward:"رمز النجمة ✦"},
{title:"البرج الليلي",icon:"🌙",who:[["Vassago","🪽","يراقب السماء ويعرف ترتيب النجوم." ]],story:"على السقف أربع نجوم مرقّمة. الملاحظة تقول: «ابدئي بالأبعد عن القمر، ثم اقتربي منه». أي ترتيب للأرقام يطابق الخريطة؟",opts:["1 - 2 - 3 - 4","4 - 3 - 2 - 1","2 - 4 - 1 - 3"],answer:1,clue:"Vassago يشير إلى النجمة الرابعة ثم يتبعها عائدًا.",reward:"رمز المفتاح ✧"}
];
function openRoom(i){if(i>0&&!solved[i-1])return;current=i;document.getElementById('ending').classList.remove('active');document.getElementById('game').classList.add('active');renderRoom();document.getElementById('game').scrollIntoView({behavior:'smooth',block:'start'});}
function renderRoom(){let r=rooms[current],html='<h2>'+r.icon+' '+r.title+'</h2>';r.who.forEach(c=>{html+='<div class="character"><div class="avatar">'+c[1]+'</div><div><b>'+c[0]+'</b><p>'+c[2]+'</p></div></div>'});html+='<div class="dialog">'+r.story+'</div><div class="choices">';r.opts.forEach((o,j)=>{html+='<button class="choice" onclick="choose('+j+')">'+o+'</button>'});html+='</div><div class="feedback" id="feedback"></div>';html+='<div id="nextArea"></div>';document.getElementById('roomContent').innerHTML=html;if(solved[current]){document.getElementById('feedback').textContent='تم حل هذا اللغز من قبل! '+r.reward;document.getElementById('nextArea').innerHTML='<button class="btn" onclick="closeRoom()">عودة للأبواب</button>'}}
function choose(n){let r=rooms[current],f=document.getElementById('feedback');if(n===r.answer){solved[current]=true;f.textContent='إجابة صحيحة! '+r.clue+' حصلتِ على '+r.reward;document.querySelectorAll('.room')[current].disabled=false;document.querySelectorAll('.room')[current].querySelector('small').textContent='✓ تم الحل · '+r.reward;document.getElementById('nextArea').innerHTML='<button class="btn" onclick="closeRoom()">حفظ الرمز والعودة</button>';updateStatus()}else{f.textContent='مو هذا الرمز… جرّبي مرة ثانية. '+r.clue}}
function closeRoom(){document.getElementById('game').classList.remove('active');if(solved.every(Boolean)){document.getElementById('ending').classList.add('active');document.getElementById('ending').scrollIntoView({behavior:'smooth'})}else{document.querySelector('.rooms').scrollIntoView({behavior:'smooth',block:'start'})}}
function updateStatus(){let n=solved.filter(Boolean).length;document.getElementById('keys').textContent='المفاتيح: '+n;document.getElementById('counter').textContent=n+' / 4 غرف';for(let i=0;i<4;i++){document.getElementById('r'+i).disabled=i>0&&!solved[i-1]}}
function restart(){solved.fill(false);for(let i=0;i<4;i++){document.getElementById('r'+i).disabled=i>0;document.getElementById('r'+i).querySelector('small').innerHTML=rooms[i].who.map(x=>x[0]).join(' & ')+'<br>لغز الغرفة'}document.getElementById('ending').classList.remove('active');updateStatus();scrollTo({top:0,behavior:'smooth'})}
updateStatus();
</script></body></html>
